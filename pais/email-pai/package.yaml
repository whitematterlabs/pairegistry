name: email-pai
kind: pai
version: 0.1.0
description: Email-handling PAI — triages and replies to incoming email
provider: deepseek
model: deepseek-v4-pro
prompt: prompt.md
wake_on:
  - email:new
  - email:backlog
  - email:draft_failed
deps:
  - mailv2         # the email driver (nested archive; brings communication/email + drafts)
  - inbox          # the bin — bounded count-first lister over the archive
  - draft-email    # the bin
home:
  links:
    - link: communication/messages
      target: var/spool/communication/messages
