name: email-pai
kind: pai
version: 0.1.0
description: Email-handling PAI — triages and replies to incoming email
provider: deepseek
model: deepseek-v4-pro
prompt: prompt.md
wake_on:
  - email:new
  - email:backlog
  - email:draft_failed
deps:
  - email          # the email driver (ships macmail)
  - mailsearch     # the bin
home:
  links:
    - link: communication/email
      target: var/spool/communication/email
    - link: communication/messages
      target: var/spool/communication/messages
    - link: drafts
      target: var/spool/communication/email/drafts
