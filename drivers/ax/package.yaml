name: ax
kind: driver
version: 0.3.0
description: "Accessibility (macOS AX) driver: piloting surface for PAIs (scoped sessions, RPC via Swift sidecar)"
min_macos: "13.0"
# Pull in the shell-callable `ax` RPC client as a sibling bin package.
# `paiman install ax` lands the driver, stages axd, and symlinks the bin
# into /usr/bin/ax so PAI shells can call it directly.
deps:
  - bin/ax
# Sidecar stage hook. End-user installs DO NOT compile: a prebuilt,
# ad-hoc-signed binary ships at sidecar/prebuilt/axd (arm64, AXSwift statically
# linked), so no Swift toolchain or network is needed. build.sh copies it to
# $PAI_ROOT/usr/libexec/ax/axd; it only invokes `swift build` on a dev machine
# whose Sources are newer than the committed binary (and then refreshes it).
hooks:
  install:
    - "bash usr/lib/drivers/ax/sidecar/build.sh"
