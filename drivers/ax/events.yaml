driver: ax
description: macOS Accessibility — piloting surface. PAIs attach scoped sessions to (pid, window_id) and actuate background windows via the bin/ax RPC client. All events carry target_pid; the kernel routes point-to-point.

processes:
  - slug: ax-in
    module: drivers.ax.inbound
    entrypoint: run

events:
  - kind: ax:scope_attached
    description: A session was successfully attached to (pid, window_id). Sidecar confirmation; inbound suppresses normal successes because attach returns this inline.
    emitted_by: drivers/ax/sidecar
    payload:
      target_pid: int        # owning PAI; kernel uses this to route, not wake_on
      session_id: string
      pid: int
      bundle_id: string
      window_id: string
      tree: list             # compressed surface — actionable controls plus opaque structural refs
      diagnostics: dict      # role counts + warnings when AX sees only window chrome/opaque panes

  - kind: ax:tree_changed
    description: Refs were added, removed, or changed inside an attached session. Delta only.
    emitted_by: drivers/ax/sidecar
    payload:
      target_pid: int
      session_id: string
      delta:
        added: list           # [{ref, role, label, value, enabled}]
        removed: list         # [ref, ...]
        changed: list         # [{ref, label?, value?, enabled?}]
      diagnostics: dict       # same shape as scope_attached diagnostics

  - kind: ax:action_result
    description: Result of a previously issued act/expand. request_id correlates with the RPC call. Inbound forwards failures; successful action confirmations stay private because act returns inline.
    emitted_by: drivers/ax/sidecar
    payload:
      target_pid: int
      session_id: string
      request_id: string
      ok: bool
      error: string           # present only when ok=false (e.g. EFOREGROUND, EREFGONE, ESECUREINPUT, EFROZEN:<capability>)
      tree_delta:             # optional; present when action mutated the tree
        added: list
        removed: list
        changed: list

  - kind: ax:scope_lost
    description: Session ended or cannot continue. Subkinds via `reason`. paused/resumed are non-terminal transitions in this family. Explicit detach confirmations stay private.
    emitted_by: drivers/ax/sidecar
    payload:
      target_pid: int
      session_id: string
      reason: string          # window_closed | app_terminated | grant_revoked | paused | resumed | detached
