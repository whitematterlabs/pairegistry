name: mailv2
kind: driver
version: 0.1.0
description: Email driver v2 — complete on-disk archive (nested YYYY/MM/DD) + rg-native queries. Parallel fork of the email/macmail driver; same communication/email tree.
deps:
  - tailer
  - draft-email
home:
  links:
    - link: mail
      target: var/spool/communication/email
    - link: communication/email
      target: var/spool/communication/email
    - link: drafts
      target: var/spool/communication/email/drafts
