name: email
kind: driver
version: 0.1.0
description: Email driver — complete on-disk archive (nested YYYY/MM/DD) under communication/email + rg-native queries.
deps:
  - tailer
  - draft-email
# One-time history population. Runs as an interactive setup step (TTY only,
# offered default-yes, skippable) because it reads the Full-Disk-Access-gated
# Mail.app Envelope Index and can outlast the 120s install-hook cap. It
# migrates a legacy flat tree first if present, then backfills; resumable +
# idempotent. A headless install skips it and prints the run-later command.
hooks:
  setup:
    - "bash usr/lib/drivers/email/libexec/backfill.sh"
home:
  links:
    - link: mail
      target: var/spool/communication/email
    - link: communication/email
      target: var/spool/communication/email
    - link: drafts
      target: var/spool/communication/email/drafts
