# Event spec for the calendar driver.
#
# Watches Apple Calendar via EventKit (EKEventStoreChangedNotification on a
# background NSRunLoop thread) and emits one `calendar:changes` event per
# refresh, carrying `new` / `changed` / `removed` lists. One event per
# refresh = one PAI nudge — per-item events would flood the bus on first
# boot when the whole horizon lands in `new`.
#
# Partition key (per item): `uid` (EKEvent.calendarItemIdentifier, stable
# across edits; falls back to eventIdentifier if unavailable).
#
# `kind` is the routing key — PAIs match it with `wake_on:` globs like
# `calendar:*` or `calendar:changes`. The kernel composes
# `<source>:<raw_kind>` to produce the routing kind.

driver: calendar
description: Apple Calendar change notifications (batched new / changed / removed).

processes:
  - slug: calendar-in
    module: drivers.calendar.inbound
    entrypoint: run

events:
  - kind: calendar:changes
    description: One refresh's diff against the cached horizon snapshot.
      Any of `new` / `changed` / `removed` may be empty, but at least one
      is non-empty (no event fires for a no-op refresh). On first boot the
      whole upcoming window lands in `new`.
    emitted_by: drivers/calendar/inbound.py
    raw_kind: changes
    payload:
      new: list[item]         # newly in horizon
      changed: list[item]     # tracked-field change on an existing uid
      removed: list[item]     # dropped from horizon (deleted / moved out / unsubscribed)
    item_shape:
      uid: string             # EKEvent.calendarItemIdentifier
      title: string
      start: string           # ISO 8601 with local tz offset
      end: string|null        # ISO 8601, or null if no end date
      location: string|null
      calendar_name: string   # EKCalendar.title (e.g. "Work", "Personal")
      notes: string|null
      is_all_day: bool
