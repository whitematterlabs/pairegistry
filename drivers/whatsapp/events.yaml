driver: whatsapp
description: Inbound (receive-only) WhatsApp messaging via Baileys bridge.

processes:
  - slug: whatsapp-in
    module: drivers.whatsapp.inbound
    entrypoint: run

events:
  - kind: whatsapp:new
    description: A new WhatsApp message arrived from a contact.
    emitted_by: drivers/whatsapp/inbound.py
    raw_kind: new_message
    payload:
      thread: string
      sender: string
      text: string
      day_file: string

  - kind: whatsapp:backlog
    description: Messages that landed while PAI was offline. Coalesced
      into a single nudge instead of N.
    emitted_by: drivers/whatsapp/inbound.py
    raw_kind: messages_backlog
    payload:
      since: string
      threads:
        - thread: string
          inbound: int
          outbound: int
          last_text: string
          day_files:
            - string
      total: int
