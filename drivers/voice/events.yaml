driver: voice
description: >
  Local wake-word + STT inbound. PAIs reply by running `say` directly in their
  shell — there is no outbound driver. No cloud. After the PAI finishes talking,
  the console arms a wake-free follow-up window (/sys/drivers/voice/followup);
  the next utterance is captured on speech onset alone, so a conversation needs
  the wake word only once. Events from a follow-up capture carry
  wake_word: "followup".

processes:
  - slug: voice-in
    module: drivers.voice.inbound
    entrypoint: run

events:
  - kind: voice:listening
    description: Wake word fired; capture is about to start (pre-transcription).
    emitted_by: drivers/voice/inbound.py
    raw_kind: listening
    payload:
      wake_word: string
      captured_at: string

  - kind: voice:utterance
    description: Wake word fired and an utterance was transcribed.
    emitted_by: drivers/voice/inbound.py
    raw_kind: utterance
    payload:
      text: string
      audio_path: string
      wake_word: string
      duration_ms: int
      captured_at: string

  - kind: voice:wake_failed
    description: Listener crashed or mic disappeared. Logged for diagnostics.
    emitted_by: drivers/voice/inbound.py
    raw_kind: wake_failed
    payload:
      reason: string
