name: coder
kind: subagent
version: 0.1.0
description: Ephemeral subagent that builds a small CLI tool from a brief and writes it to bin/. Spawned by root via grow-capability when a child PAI escalates a missing capability.
prompt: usr/lib/subagents/coder/prompt.md
provider: anthropic
# model: claude-sonnet-4-6  # optional override; otherwise provider default

# Pre-handoff debugger pass: after the coder turn completes, an out-of-band
# reviewer LLM re-reads files coder touched and may rewrite them. Paths are
# $PAI_ROOT-relative; excludes are prefix matches.
debugger:
  provider: deepseek
  model: deepseek-v4-pro
  watch_paths: [usr/bin, usr/lib, usr/share/prompts, etc]
  exclude: [usr/lib/venv, usr/src, opt]
  max_lines: 50
