name: claudecode
kind: subagent
version: 0.1.0
description: Ephemeral subagent with a cheap deepseek outer brain whose only job is to compose a brief and shell out to `claude -p` (ClaudeCode headless). The real intelligence and harness live inside the `claude -p` subprocess.
prompt: prompt.md
provider: deepseek
model: deepseek-v4-pro

# Pre-handoff debugger pass: after the subagent turn completes, an out-of-band
# reviewer LLM re-reads files it touched and may rewrite them. Paths are
# $PAI_ROOT-relative; excludes are prefix matches.
debugger:
  provider: deepseek
  model: deepseek-v4-pro
  watch_paths: [usr/bin, usr/lib, usr/share/prompts, etc]
  exclude: [usr/lib/venv, usr/src, opt]
  max_lines: 50
